[project]
name = "ratsignal-ml"
version = "0.1.0"
description = "Pest-violation risk model for RatSignal"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "requests>=2.32",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
